<!DOCTYPE html>
<html lang="en">
<head>

    <title>김세희</title>
<style>
    html,body{margin: 0;padding:0%;height:100%;}
     header { width:100%;height:15%;background:violet;}

<p>키우고 싶은 동물은?</p>

 <footer> <details>
